name: AWS OIDC check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && vars.AWS_ROLE_ARN_PLAN || vars.AWS_ROLE_ARN_DEPLOY }}
          aws-region: ap-northeast-1
      - run: aws sts get-caller-identity