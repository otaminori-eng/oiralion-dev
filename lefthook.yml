pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --verbose
    biome:
      glob: "*.{js,jsx,ts,tsx,json,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    terraform-fmt:
      glob: "*.tf"
      run: terraform fmt {staged_files}
      stage_fixed: true
    trivy:
      glob: "*.tf"
      run: trivy config --severity HIGH,CRITICAL --exit-code 1 .
pre-push:
  commands:
    test:
      run: pnpm test